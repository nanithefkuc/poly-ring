[package]
name = "poly-ring"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/nanithefkuc/poly-ring"
description = "Univariate and multivariate polynomial arithmetic, evaluation, interpolation, and factorization over finite fields."
readme = "README.md"
homepage = "https://github.com/nanithefkuc/poly-ring"
categories = ["mathematics", "algorithms", "no-std"]
keywords = ["polynomial", "finite-field", "interpolation", "factorization", "simd"]
# Package the library, tests, benchmarks, examples, and release documents.
# Cargo also includes the manifest, lockfile, and generated package metadata.
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[features]
default = ["std", "simd", "fft"]
std = ["fgf/std", "butterfly-fft?/std"]
# simd implies std, as in fgf and gfm: fgf's backend cache is a LazyLock, and a
# simd-without-std combination would compile and silently run scalar.
simd = ["std", "fgf/simd", "butterfly-fft?/simd"]
# Structured-domain evaluation/interpolation composes butterfly-fft (which
# carries its own SIMD `unsafe`). Most L1 consumers want it; a transform-free
# consumer builds --no-default-features to drop it. Works without `std`:
# butterfly-fft's core is no_std-capable, and so is everything this feature
# gates here.
fft = ["dep:butterfly-fft"]
# poly-ring's own unstable surface, for benchmarks and downstream
# experimentation. Not a compatibility promise. Distinct from fgf's
# `internals`, which this crate deliberately does not take.
internals = []

[dependencies]
# Field arithmetic and packed-buffer vector kernels, taken from the registry
# at an exact release: a floating dependency is a format-break risk when the
# dependency feeds wire bytes. Every consumer resolves this same release so
# one `fgf` compiles.
fgf = { version = "=1.2.1", default-features = false }
# Additive-FFT transforms for subspace/coset domains, composed (never
# re-implemented) under the default-on `fft` feature.
butterfly-fft = { version = "=1.0.2", optional = true, default-features = false }

[dev-dependencies]
# Tests and benches exercise the unstable internals facade directly; a
# self dev-dependency turns that feature on for every consumer of the lib
# without leaking it into the published dependency graph.
poly-ring = { path = ".", features = ["internals"] }
ark-ff = "0.6"
ark-poly = "0.6"
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
lambdaworks-math = "0.13"
proptest = { version = "1", default-features = true }
# Hasse competitor panel only (BENCHMARKS.md); never a runtime dependency.
winter-math = "=0.13.1"

[[bench]]
name = "poly"
harness = false
required-features = ["internals"]

[[bench]]
name = "hasse"
harness = false

[[bench]]
name = "competitors"
harness = false

# The prepared-product panel needs the forced route entry points.
[[bench]]
name = "prepared"
harness = false
required-features = ["internals"]

[[example]]
name = "weighted_eval"

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
