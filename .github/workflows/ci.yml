name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target aarch64-unknown-linux-gnu --no-default-features
      - run: cargo build --target wasm32-unknown-unknown --no-default-features

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features

  deps:
    name: dependency tree shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: default features carry fgf and butterfly-fft only
        run: |
          cargo tree --depth 1 | tee tree.txt
          ! grep -Eq 'gfm|sgraph|lattica|syndrome-engine|archmage' tree.txt
      - name: no-default-features carries fgf only
        run: |
          cargo tree --depth 1 --no-default-features | tee tree-core.txt
          ! grep -q butterfly-fft tree-core.txt

  backends:
    name: forced backend panel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [v3_gfni_crypto, v3, v2, scalar]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: ${{ matrix.backend }}

  # Line coverage of the crate's own source must stay at or above 95%.
  # The dispatch layer picks one backend per process, so the runs are
  # merged — one per forced SIMD_BACKEND tier, plus the
  # no-default-features (no_std + alloc) suite, whose compiled line set
  # differs — before the report gates.
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: scalar
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3_gfni_crypto
      - run: cargo llvm-cov --no-report --no-default-features
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --fail-under-lines 95 --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov
